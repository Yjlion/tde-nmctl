name: Build Debian packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debian ${{ matrix.suite }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [ bookworm, trixie ]
    env:
      DEBIAN_FRONTEND: noninteractive
      TDE_MIRROR: http://mirror.ppa.trinitydesktop.org/trinity/deb/trinity-r14.1.x
      DEBFULLNAME: GitHub Actions
      DEBEMAIL: actions@users.noreply.github.com

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg git

      - name: Add the Trinity Desktop repository
        run: |
          curl -fsSL --retry 5 -o /tmp/trinity-keyring.deb \
            https://mirror.ppa.trinitydesktop.org/trinity/deb/trinity-keyring.deb
          apt-get install -y /tmp/trinity-keyring.deb
          echo "deb ${TDE_MIRROR} ${{ matrix.suite }} main deps" \
            > /etc/apt/sources.list.d/trinity.list
          apt-get update

      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends build-essential devscripts equivs lintian
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control
          rm -f tde-nmctl-build-deps_*

      - name: Build the package
        run: |
          # add the suite to the version so packages for both suites can be
          # published side by side
          VERSION=$(dpkg-parsechangelog -S Version)
          dch --newversion "${VERSION}+${{ matrix.suite }}" --distribution ${{ matrix.suite }} \
              --force-distribution "Build for Debian ${{ matrix.suite }}."
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          mv ../*.deb ../*.buildinfo ../*.changes artifacts/

      - name: Run lintian
        continue-on-error: true
        run: lintian --info --display-info artifacts/*.changes

      - name: Test installation
        run: |
          apt-get install -y --no-install-recommends ./artifacts/tde-nmctl-trinity_*.deb
          test -x /opt/trinity/bin/tde-nmctl
          test -x /opt/trinity/bin/tde-nmctl-tray
          test -f /opt/trinity/lib/trinity/kcm_nmctl.so
          test -f /opt/trinity/lib/trinity/kcm_nmctl.la
          test -f /opt/trinity/share/applications/tde/nmctl.desktop
          grep -q 'X-TDE-settings-network' /opt/trinity/share/applications/tde/nmctl.desktop
          grep -q 'X-TDE-systemsettings-network' /opt/trinity/share/applications/tde/nmctl.desktop
          test -f /opt/trinity/share/doc/tde/HTML/en/tde-nmctl/index.cache.bz2
          test -f /opt/trinity/share/doc/tde/HTML/en/tde-nmctl/tray-popup.png
          test -f /opt/trinity/share/man/man1/tde-nmctl.1
          test -f /opt/trinity/share/man/man1/tde-nmctl-tray.1
          test -f /opt/trinity/share/icons/hicolor/22x22/apps/tde-nmctl-signal-75.png
          test -f /opt/trinity/share/apps/tde-nmctl-tray/eventsrc
          # the tray icon starts at login unless the user turns it off
          grep -qx 'X-TDE-autostart-condition=tde-nmctl-trayrc:General:Autostart:true' \
            /opt/trinity/share/autostart/tde-nmctl-tray-autostart.desktop
          /opt/trinity/bin/tde-nmctl --version
          /opt/trinity/bin/tde-nmctl-tray --version

      - name: Test against a simulated NetworkManager
        run: |
          apt-get install -y --no-install-recommends dbus python3-dbus python3-gi procps
          tests/run-tests.sh obj-*/tests/clienttest /opt/trinity/bin/tde-nmctl

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tde-nmctl-${{ matrix.suite }}
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
